#version=RHEL9
install
lang en_US.UTF-8
keyboard us
network --bootproto=dhcp --device=eth0 --onboot=on

rootpw --iscrypted \$6\$replace_me_with_real_hash
firewall --enabled --service=ssh
selinux --enforcing
timezone Europe/Berlin --isUtc

text
skipx

# 💽 Disk partitioning (autopart can be replaced)
autopart --type=lvm
# Alternatively:
# clearpart --all --initlabel
# part /boot --fstype="xfs" --size=1024
# part pv.01 --size=1 --grow
# volgroup alma pv.01
# logvol / --vgname=alma --name=root --size=10240 --grow --fstype=xfs

# ⬇️ Package selection
%packages
@^minimal-environment
kexec-tools
chrony
vim-enhanced
%end

# 🔧 Post-install script
%post --log=/root/ks-post.log
curl -s https://your-domain/autohard/postinstall.sh | bash -
%end
